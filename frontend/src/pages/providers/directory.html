<!DOCTYPE html>
<html lang="es" class="h-full bg-surface">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TurisPro - Proveedores</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#004d99',surface:'#f9f9ff','surface-container-low':'#f0f3ff','outline-variant':'#c2c6d4'}}}}</script>
<link rel="stylesheet" href="../../assets/css/turispro-sidebar.css">
<style>html,body{min-width:320px}body{min-height:100vh}@media(max-width:1100px){body{overflow:auto!important}body>div.ml-64{margin-left:0;min-height:100vh;height:auto;overflow:visible}body>div.ml-64>header{height:auto;min-height:4rem;padding:.75rem 1rem;flex-wrap:wrap;gap:.75rem}body>div.ml-64>main{overflow:visible}}@media(max-width:640px){main{padding:1rem!important}}</style>
<style>@media(max-width:1100px){#providerDetailModal{left:0!important}}#providerDetailContent{min-height:0;overscroll-behavior:contain}#providerDetailModal>div{min-width:0}</style>
</head>
<body class="h-full bg-[#f8faff] text-slate-800 flex overflow-hidden">
<script src="../../assets/js/sidebar.js"></script>
<div class="ml-64 min-w-0 flex-1 flex flex-col h-screen overflow-hidden">
<header class="h-16 bg-white border-b border-slate-200 px-6 flex justify-between items-center shadow-sm z-30 shrink-0">
  <div class="flex items-center min-w-0 flex-1">
  <div class="relative w-[min(34vw,390px)] min-w-[180px]"><span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</span><input id="providerSearch" type="search" autocomplete="off" placeholder="Buscar proveedor por nombre o ID..." class="w-full h-10 rounded-lg border-slate-200 bg-slate-50 pl-10 pr-3 text-sm focus:border-primary focus:ring-primary"></div></div>
  <button data-tp-roles="ADMINISTRADOR GESTOR_PROVEEDORES" onclick="location.href='register.html'" class="inline-flex items-center gap-2 rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white hover:bg-blue-800"><span class="material-symbols-outlined text-lg">add</span>Registrar proveedor</button>
</header>
<main class="flex-1 min-w-0 overflow-y-auto p-6 lg:p-8 space-y-6">
  <section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm"><div class="flex flex-col gap-3"><div class="flex items-center justify-between gap-3"><h2 class="text-sm font-bold uppercase tracking-wide text-slate-600">Categorías</h2></div><div id="categoryFilters" class="flex flex-wrap gap-2">
    <button data-type="" class="category-filter active rounded-full bg-primary px-4 py-2 text-sm font-semibold text-white">Todos</button>
    <button data-type="HOTEL" class="category-filter rounded-full border border-slate-200 px-4 py-2 text-sm text-slate-600 hover:border-primary hover:text-primary">Hoteles</button>
    <button data-type="TRANSPORTADOR" class="category-filter rounded-full border border-slate-200 px-4 py-2 text-sm text-slate-600 hover:border-primary hover:text-primary">Transporte</button>
    <button data-type="OPERADOR" class="category-filter rounded-full border border-slate-200 px-4 py-2 text-sm text-slate-600 hover:border-primary hover:text-primary">Agencias y operadores</button>
    <button data-type="GUIA" class="category-filter rounded-full border border-slate-200 px-4 py-2 text-sm text-slate-600 hover:border-primary hover:text-primary">Guías</button>
  </div></div></section>
  <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
    <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4"><div><h2 class="font-bold text-slate-900">Catálogo de proveedores</h2><p class="mt-0.5 text-xs text-slate-500">Selecciona un nombre para consultar su ficha completa.</p></div><span id="providerCount" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600">Cargando...</span></div>
    <div id="providerCatalog" class="divide-y divide-slate-100"><div class="p-8 text-center text-sm text-slate-500">Cargando proveedores...</div></div>
  </section>
  <footer class="border-t border-slate-200 py-5 text-xs text-slate-400">TurisPro · Directorio y gestión de proveedores</footer>
</main></div>
<div id="providerDetailModal" class="fixed inset-y-0 left-64 right-0 z-[1101] hidden items-center justify-center bg-slate-950/60 p-3 sm:p-6" role="dialog" aria-modal="true" aria-labelledby="providerDetailTitle">
 <div class="flex max-h-[94vh] w-full max-w-6xl flex-col overflow-hidden rounded-2xl bg-white shadow-2xl">
  <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4 sm:px-7"><div class="min-w-0"><p class="text-[11px] font-bold uppercase tracking-widest text-primary">Ficha del proveedor</p><h2 id="providerDetailTitle" class="mt-1 truncate text-xl font-bold text-slate-900">Cargando...</h2></div><button id="closeProviderDetail" class="ml-3 rounded-lg p-2 text-slate-500 hover:bg-slate-100" aria-label="Cerrar"><span class="material-symbols-outlined">close</span></button></div>
  <div id="providerDetailContent" class="overflow-y-auto p-5 sm:p-7"><p class="text-sm text-slate-500">Consultando información en la base de datos...</p></div>
 </div>
</div>
<script src="../../assets/js/api.js"></script>
<script>
let tipoSeleccionado='';let debounceTimeout;
document.addEventListener('DOMContentLoaded',async()=>{
 if(!TurisProAPI.requireAuth())return;
 document.getElementById('providerSearch').addEventListener('input',()=>{clearTimeout(debounceTimeout);debounceTimeout=setTimeout(cargarProveedores,250)});
 document.querySelectorAll('.category-filter').forEach(btn=>btn.addEventListener('click',()=>{tipoSeleccionado=btn.dataset.type||'';actualizarBotonesCategoria();cargarProveedores()}));
 document.getElementById('closeProviderDetail').addEventListener('click',cerrarFichaProveedor);
 document.getElementById('providerDetailModal').addEventListener('click',e=>{if(e.target.id==='providerDetailModal')cerrarFichaProveedor()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarFichaProveedor()});
 await cargarProveedores();
});
function actualizarBotonesCategoria(){document.querySelectorAll('.category-filter').forEach(b=>{const active=(b.dataset.type||'')===tipoSeleccionado;b.classList.toggle('active',active);b.classList.toggle('bg-primary',active);b.classList.toggle('text-white',active);b.classList.toggle('border',!active);b.classList.toggle('border-slate-200',!active);b.classList.toggle('text-slate-600',!active)})}
async function cargarProveedores(){const catalog=document.getElementById('providerCatalog'),count=document.getElementById('providerCount'),texto=document.getElementById('providerSearch').value.trim();catalog.innerHTML='<div class="p-8 text-center text-sm text-slate-500">Consultando la base de datos...</div>';try{const resp=await TurisProAPI.getProveedores({texto,tipo:tipoSeleccionado});const items=Array.isArray(resp.items)?resp.items:[];count.textContent=`${items.length} ${items.length===1?'proveedor':'proveedores'}`;if(!items.length){catalog.innerHTML='<div class="p-10 text-center"><span class="material-symbols-outlined text-4xl text-slate-300">domain_disabled</span><p class="mt-2 font-semibold text-slate-700">No se encontraron proveedores</p><p class="mt-1 text-sm text-slate-500">Prueba con otro nombre, ID o categoría.</p></div>';return}catalog.innerHTML='';items.forEach(p=>{const row=document.createElement('button');row.type='button';row.className='group flex w-full items-center justify-between gap-4 px-5 py-4 text-left transition hover:bg-blue-50/70 sm:px-6';row.innerHTML=`<span class="flex min-w-0 items-center gap-3"><span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-blue-50 text-primary group-hover:bg-blue-100"><span class="material-symbols-outlined">${iconoTipo(p.tipo)}</span></span><span class="min-w-0"><span class="block truncate font-semibold text-slate-800 group-hover:text-primary">${escapeHtml(p.razonSocial||'Proveedor sin nombre')}</span><span class="mt-0.5 block text-xs text-slate-400">${escapeHtml(nombreTipo(p.tipo))} · ID #${escapeHtml(p.idProveedor)}</span></span></span><span class="material-symbols-outlined shrink-0 text-slate-300 transition group-hover:translate-x-1 group-hover:text-primary">chevron_right</span>`;row.addEventListener('click',()=>abrirFichaProveedor(p.idProveedor));catalog.appendChild(row)})}catch(err){console.error(err);count.textContent='Error de conexión';catalog.innerHTML=`<div class="p-8 text-center text-sm text-red-600">No fue posible consultar los proveedores. ${escapeHtml(err.message||'Verifica que el backend esté ejecutándose.')}</div>`}}
async function abrirFichaProveedor(id){const modal=document.getElementById('providerDetailModal'),title=document.getElementById('providerDetailTitle'),content=document.getElementById('providerDetailContent');modal.classList.remove('hidden');modal.classList.add('flex');title.textContent='Cargando ficha...';content.innerHTML='<p class="text-sm text-slate-500">Consultando información...</p>';try{const response=await TurisProAPI.getProveedorDetalle(id);const p=response.proveedor||response;const tabs=response.pestanas||{};const servicios=Array.isArray(tabs.serviciosYTarifas)?tabs.serviciosYTarifas:[];const docs=Array.isArray(tabs.documentos)?tabs.documentos:[];const evaluaciones=tabs.evaluaciones||{};const historial=Array.isArray(evaluaciones.historial)?evaluaciones.historial:[];const incidentes=Array.isArray(tabs.incidentes)?tabs.incidentes:[];const zonas=Array.isArray(p.zonas)?p.zonas:[];const docsVigentes=docs.filter(d=>String(d.estado||'').toUpperCase()==='VIGENTE');const docsPorVencer=docs.filter(d=>String(d.estado||'').toUpperCase()==='POR_VENCER');const docsVencidos=docs.filter(d=>String(d.estado||'').toUpperCase()==='VENCIDO');const promedio=evaluaciones.promedioGeneral;title.textContent=p.razonSocial||'Proveedor';
content.innerHTML=`
 <section class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">
 ${dato('Identificación',`#${p.idProveedor}`)}${dato('Categoría',nombreTipo(p.tipo))}${dato('Estado',p.estadoCiclo|| (p.activo?'Activo':'Inactivo'))}${dato('NIT',p.nit||'Sin registrar')}
 ${dato('Correo',p.correo||'Sin registrar')}${dato('Teléfono',p.telefono||'Sin registrar')}${dato('Dirección',p.direccion||'Sin registrar')}${dato('Ubicación',zonas.length?zonas.map(z=>[z.ciudad,z.departamento,z.pais].filter(Boolean).join(', ')).join(' · '):'Sin ubicación registrada')}
 </section>
 <section class="mt-6"><h3 class="mb-3 text-sm font-bold uppercase tracking-wide text-slate-600">Resumen de gestión</h3><div class="grid grid-cols-2 gap-3 lg:grid-cols-4">
 ${metrica('Evaluación general',promedio==null?'Sin evaluar':`${Number(promedio).toFixed(2)} / 5`,'star')}${metrica('Incidentes registrados',String(incidentes.length),'report_problem')}${metrica('Documentos vigentes',String(docsVigentes.length),'verified_user')}${metrica('Servicios registrados',String(servicios.length),'room_service')}
 </div><p class="mt-2 text-xs text-slate-400">Documentos por vencer: ${docsPorVencer.length} · Documentos vencidos: ${docsVencidos.length} · Evaluaciones: ${historial.length}</p></section>
 <section class="mt-6"><div class="mb-3 flex items-center justify-between"><h3 class="text-sm font-bold uppercase tracking-wide text-slate-600">Servicios del proveedor</h3><span class="text-xs text-slate-400">${servicios.length} registrados</span></div>${servicios.length?`<div class="grid grid-cols-1 gap-3 md:grid-cols-2">${servicios.map(s=>`<article class="rounded-xl border border-slate-200 p-4"><div class="flex items-start justify-between gap-3"><h4 class="font-semibold text-slate-800">${escapeHtml(s.nombre||'Servicio sin nombre')}</h4><span class="rounded-full px-2 py-1 text-[11px] font-semibold ${s.estaVigente?'bg-emerald-50 text-emerald-700':'bg-amber-50 text-amber-700'}">${s.estaVigente?'Vigente':'Fuera de vigencia'}</span></div><p class="mt-2 text-sm text-slate-500">${escapeHtml(s.descripcion||'Sin descripción')}</p><p class="mt-3 font-semibold text-primary">${formatearMoneda(s.tarifa)} <span class="text-xs font-normal text-slate-500">/ ${escapeHtml(s.unidad||'unidad')}</span></p><p class="mt-1 text-xs text-slate-400">Vigencia: ${fecha(s.vigenteDesde)} – ${fecha(s.vigenteHasta)}</p></article>`).join('')}</div>`:'<p class="rounded-lg bg-slate-50 p-4 text-sm text-slate-500">Este proveedor no tiene servicios registrados.</p>'}</section>
 <section class="mt-6"><h3 class="mb-3 text-sm font-bold uppercase tracking-wide text-slate-600">Documentación</h3>${docs.length?`<div class="overflow-x-auto rounded-xl border border-slate-200"><table class="w-full text-left text-sm"><thead class="bg-slate-50 text-xs uppercase text-slate-500"><tr><th class="px-4 py-3">Documento</th><th class="px-4 py-3">Vencimiento</th><th class="px-4 py-3">Estado</th></tr></thead><tbody class="divide-y divide-slate-100">${docs.map(d=>`<tr><td class="px-4 py-3 font-medium">${escapeHtml(d.tipo||'Documento')}</td><td class="px-4 py-3">${fecha(d.fechaVencimiento)}</td><td class="px-4 py-3">${etiquetaEstado(d.estado)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="rounded-lg bg-slate-50 p-4 text-sm text-slate-500">No hay documentos registrados.</p>'}</section>
 <section class="mt-6"><h3 class="mb-3 text-sm font-bold uppercase tracking-wide text-slate-600">Historial de evaluaciones</h3>${historial.length?`<div class="space-y-2">${historial.map(e=>`<article class="rounded-lg border border-slate-200 p-3"><div class="flex flex-wrap items-center justify-between gap-2"><strong class="text-sm">Calificación: ${Number(e.promedio).toFixed(2)} / 5</strong><span class="text-xs text-slate-400">${fecha(e.fecha)}</span></div><p class="mt-1 text-sm text-slate-500">${escapeHtml(e.comentario||'Sin observaciones')}</p></article>`).join('')}</div>`:'<p class="rounded-lg bg-slate-50 p-4 text-sm text-slate-500">No hay evaluaciones registradas.</p>'}</section>
 <section class="mt-6"><h3 class="mb-3 text-sm font-bold uppercase tracking-wide text-slate-600">Incidentes</h3>${incidentes.length?`<div class="space-y-2">${incidentes.map(i=>`<article class="rounded-lg border border-slate-200 p-3"><div class="flex flex-wrap items-center justify-between gap-2"><strong class="text-sm">${escapeHtml(i.tipo||'Incidente')} · ${escapeHtml(i.severidad||'')}</strong><span class="text-xs text-slate-400">${fecha(i.fecha)}</span></div><p class="mt-1 text-sm text-slate-600">${escapeHtml(i.descripcion||'Sin descripción')}</p><p class="mt-2 text-xs text-slate-500">Estado: ${escapeHtml(i.estado||'Sin estado')}</p></article>`).join('')}</div>`:'<p class="rounded-lg bg-slate-50 p-4 text-sm text-slate-500">No hay incidentes registrados.</p>'}</section>
 <section class="mt-6 rounded-xl border border-blue-100 bg-blue-50/60 p-4"><h3 class="text-sm font-bold text-slate-700">Nivel de riesgo registrado</h3><p class="mt-1 text-sm text-slate-600">${escapeHtml(p.nivelRiesgo||'SIN_DATOS')} ${p.puntajeRiesgo==null?'':`· ${escapeHtml(p.puntajeRiesgo)}/100`}</p><p class="mt-1 text-xs text-slate-500">La información se consulta directamente desde los registros asociados a este proveedor.</p></section>`;
 }catch(error){title.textContent='No fue posible cargar la ficha';content.innerHTML=`<p class="text-sm text-red-600">${escapeHtml(error.message||'Error de conexión con el backend.')}</p>`}}
function dato(label,value){return `<div class="min-w-0 rounded-xl border border-slate-200 bg-slate-50 p-3"><p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">${label}</p><p class="mt-1 break-words text-sm font-medium text-slate-800">${escapeHtml(value)}</p></div>`}
function metrica(label,value,icon){return `<div class="rounded-xl border border-slate-200 bg-white p-3"><span class="material-symbols-outlined text-xl text-primary">${icon}</span><p class="mt-2 text-xl font-bold text-slate-900">${escapeHtml(value)}</p><p class="mt-0.5 text-xs text-slate-500">${label}</p></div>`}
function etiquetaEstado(estado){const e=String(estado||'').toUpperCase();const cls=e==='VIGENTE'?'bg-emerald-50 text-emerald-700':e==='POR_VENCER'?'bg-amber-50 text-amber-700':'bg-red-50 text-red-700';return `<span class="rounded-full px-2 py-1 text-xs font-semibold ${cls}">${escapeHtml(estado||'Sin estado')}</span>`}
function nombreTipo(tipo){return ({HOTEL:'Hotel',TRANSPORTADOR:'Transporte',OPERADOR:'Agencia u operador',GUIA:'Guía'})[tipo]||tipo||'Sin categoría'}function iconoTipo(tipo){return ({HOTEL:'hotel',TRANSPORTADOR:'airport_shuttle',OPERADOR:'travel_explore',GUIA:'hiking'})[tipo]||'business'}
function formatearMoneda(v){const n=Number(v);return Number.isFinite(n)?new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n):'Tarifa no registrada'}function fecha(v){if(!v)return '—';const d=new Date(`${String(v).slice(0,10)}T12:00:00`);return Number.isNaN(d.getTime())?escapeHtml(v):d.toLocaleDateString('es-CO')}
function cerrarFichaProveedor(){const modal=document.getElementById('providerDetailModal');modal.classList.add('hidden');modal.classList.remove('flex')}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
</body></html>
