<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TurisPro - Incidentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="../../../assets/css/turispro-sidebar.css" rel="stylesheet">
<style>body{font-family:'Hanken Grotesk',sans-serif;background:#f6faff}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20}.field{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px 12px;background:white;font-size:13px}.field:focus{outline:2px solid #bae6fd;border-color:#0284c7}</style>
</head>
<body class="min-h-screen text-slate-800">
<script src="../../../assets/js/sidebar.js"></script>
<div class="ml-64 min-h-screen flex flex-col">

<main class="w-full max-w-7xl mx-auto p-8 space-y-6">

<section class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm space-y-4">
<div><h2 class="font-bold text-slate-900">1. Buscar proveedor</h2><p class="text-xs text-slate-500 mt-1">Busca por nombre, NIT o identificador.</p></div>
<div class="relative"><span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</span><input id="provider-search" class="field pl-10" type="search" placeholder="Escribe el nombre, NIT o ID del proveedor..."><div id="provider-results" class="hidden absolute z-30 top-full left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg max-h-64 overflow-y-auto"></div></div>
<div id="selected-provider" class="hidden rounded-lg border border-sky-200 bg-sky-50 p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><p class="text-xs text-sky-700 font-semibold">PROVEEDOR SELECCIONADO</p><p id="provider-name" class="font-bold text-slate-900 mt-1"></p><p id="provider-meta" class="text-xs text-slate-600 mt-1"></p></div><button id="change-provider" class="text-sm font-semibold text-sky-700 hover:text-sky-900">Cambiar proveedor</button></div>
</section>
<section id="incident-workspace" class="hidden space-y-4">
<div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><h2 class="font-bold text-slate-900">2. Incidentes del proveedor</h2><p class="text-xs text-slate-500 mt-1">Consulta el historial o registra una nueva incidencia.</p></div><button id="open-incident" data-tp-roles="ADMINISTRADOR EVALUADOR" class="rounded-lg bg-sky-700 hover:bg-sky-800 text-white px-4 py-2.5 text-sm font-semibold inline-flex items-center gap-2"><span class="material-symbols-outlined text-lg">add_alert</span>Registrar incidente</button></div>
<div id="incident-list" class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden"><div class="p-8 text-center text-sm text-slate-500">Selecciona un proveedor para consultar sus incidentes.</div></div>
</section>
<div id="page-message" class="text-sm" role="status"></div>
</main></div>
<div id="incident-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 p-4 items-center justify-center"><div class="bg-white rounded-2xl shadow-xl w-full max-w-xl overflow-hidden"><div class="p-5 border-b border-slate-200 flex items-center justify-between"><div><h3 class="font-bold text-lg">Registrar incidente</h3><p id="modal-provider" class="text-xs text-slate-500 mt-1"></p></div><button id="close-modal" class="text-slate-500 hover:text-slate-900"><span class="material-symbols-outlined">close</span></button></div>
<form id="incident-form" class="p-5 space-y-4"><div class="grid sm:grid-cols-2 gap-4"><label class="text-xs font-semibold text-slate-700">Tipo de incidente<select id="incident-type" class="field mt-1" required><option value="">Selecciona...</option><option value="retraso">Retraso en servicio</option><option value="queja">Queja o reclamo</option><option value="incumplimiento">Incumplimiento contractual</option><option value="infraestructura">Falla de infraestructura</option><option value="documental">Incumplimiento documental</option><option value="otro">Otro</option></select></label><label class="text-xs font-semibold text-slate-700">Severidad<select id="incident-severity" class="field mt-1" required disabled><option value="BAJA">Baja</option><option value="MEDIA">Media</option><option value="ALTA">Alta</option></select><span id="severity-hint" class="block mt-1 text-[11px] font-normal text-slate-500">La severidad se asigna automáticamente según el tipo de incidente.</span></label></div><label class="block text-xs font-semibold text-slate-700">Estado inicial<select id="incident-status" class="field mt-1"><option value="ABIERTO">Abierto</option><option value="EN_SEGUIMIENTO" selected>En seguimiento</option><option value="CERRADO">Cerrado</option></select></label><label class="block text-xs font-semibold text-slate-700">Descripción<textarea id="incident-description" class="field mt-1" rows="4" required placeholder="Describe qué ocurrió..."></textarea></label><div id="form-error" class="text-xs text-rose-600"></div><div class="flex justify-end gap-2 pt-3 border-t border-slate-100"><button type="button" id="cancel-modal" class="px-4 py-2 rounded-lg border border-slate-300 text-sm">Cancelar</button><button type="submit" class="px-4 py-2 rounded-lg bg-sky-700 hover:bg-sky-800 text-white text-sm font-semibold">Guardar incidente</button></div></form></div></div>
<script src="../../../assets/js/api.js"></script>
<script>
(() => {
 const $=id=>document.getElementById(id); let providers=[], selected=null, debounce;
 const severityByType={retraso:'MEDIA',queja:'MEDIA',incumplimiento:'ALTA',infraestructura:'ALTA',documental:'MEDIA'};
 const severityLabels={BAJA:'Baja',MEDIA:'Media',ALTA:'Alta'};
 function updateSeverity(){const type=$('incident-type').value,select=$('incident-severity'),hint=$('severity-hint');if(type==='otro'){select.disabled=false;select.value='MEDIA';hint.textContent='Para este tipo puedes elegir manualmente la severidad.';}else{select.disabled=true;select.value=severityByType[type]||'';hint.textContent=type?'Severidad asignada automáticamente: '+(severityLabels[select.value]||'—')+'.':'La severidad se asigna automáticamente según el tipo de incidente.';}}
 const showMessage=(message,error=false)=>{$('page-message').textContent=message;$('page-message').className='text-sm '+(error?'text-rose-600':'text-emerald-700')};
 const unwrap=list=>Array.isArray(list)?list:(list?.items||list?.proveedores||[]);
 async function loadProviders(){
  try {
   providers=unwrap(await TurisProAPI.getProveedores({}));
   const params=new URLSearchParams(window.location.search);
   const providerId=params.get('id');
   if(providerId){
    const provider=providers.find(p=>String(p.idProveedor??p.id)===String(providerId));
    if(provider) await selectProvider(provider);
    else showMessage('No se encontró el proveedor solicitado. Comprueba que siga registrado.',true);
   }
  }catch(e){showMessage('No se pudieron cargar los proveedores. Comprueba que el backend esté iniciado.',true)}
}
 function searchProviders(){const q=$('provider-search').value.trim().toLowerCase(),box=$('provider-results');if(!q){box.classList.add('hidden');return}const matches=providers.filter(p=>[p.nombre,p.razonSocial,p.nit,p.id,p.idProveedor].some(v=>String(v??'').toLowerCase().includes(q))).slice(0,12);box.innerHTML='';if(!matches.length){box.innerHTML='<div class="p-4 text-sm text-slate-500">No se encontraron proveedores.</div>'}else matches.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='w-full text-left px-4 py-3 hover:bg-sky-50 border-b border-slate-100 last:border-0';const name=p.razonSocial||p.nombre||'Proveedor';b.innerHTML=`<div class="font-semibold text-sm text-slate-800"></div><div class="text-xs text-slate-500 mt-1"></div>`;b.children[0].textContent=name;b.children[1].textContent=`ID: ${p.idProveedor??p.id??'—'} · NIT: ${p.nit||'No registrado'} · ${(p.zonas||[]).map(z=>z.ciudad).filter(Boolean).join(', ')||p.ciudad||'Ubicación no registrada'}`;b.addEventListener('click',()=>selectProvider(p));box.appendChild(b)});box.classList.remove('hidden')}
 async function selectProvider(p){selected=p;$('provider-results').classList.add('hidden');$('provider-search').value='';$('selected-provider').classList.remove('hidden');$('provider-name').textContent=p.razonSocial||p.nombre||'Proveedor';$('provider-meta').textContent=`ID: ${p.idProveedor??p.id??'—'} · NIT: ${p.nit||'No registrado'} · ${(p.zonas||[]).map(z=>z.ciudad).filter(Boolean).join(', ')||p.ciudad||'Ubicación no registrada'}`;$('incident-workspace').classList.remove('hidden');$('modal-provider').textContent=$('provider-name').textContent;await loadIncidents()}
 async function loadIncidents(){const id=selected?.idProveedor??selected?.id;const box=$('incident-list');box.innerHTML='<div class="p-8 text-center text-sm text-slate-500">Cargando incidentes...</div>';try{const data=await TurisProAPI.getIncidentes(id);const items=unwrap(data);if(!items.length){box.innerHTML='<div class="p-10 text-center"><span class="material-symbols-outlined text-3xl text-slate-300">task_alt</span><p class="font-semibold text-slate-700 mt-2">No hay incidentes registrados</p><p class="text-xs text-slate-500 mt-1">Puedes registrar el primer incidente de este proveedor.</p></div>';return}box.innerHTML='<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-xs text-slate-500"><tr><th class="text-left p-4">Fecha</th><th class="text-left p-4">Tipo</th><th class="text-left p-4">Descripción</th><th class="text-left p-4">Severidad</th><th class="text-left p-4">Estado</th></tr></thead><tbody></tbody></table></div>';const tbody=box.querySelector('tbody');
 const incidentTarget=new URLSearchParams(window.location.search).get('incidenteId');
 items.forEach(i=>{
  const tr=document.createElement('tr');
  tr.className='border-t border-slate-100';
  tr.dataset.incidentId=String(i.idIncidente??'');
  [i.fecha?new Date(i.fecha).toLocaleDateString('es-CO'):'—',i.tipo||'—',i.descripcion||'—',i.severidad||'—',String(i.estado||'—').replaceAll('_',' ')].forEach(v=>{const td=document.createElement('td');td.className='p-4 text-slate-700';td.textContent=v;tr.appendChild(td)});
  if(incidentTarget && String(i.idIncidente)===String(incidentTarget)){
   tr.classList.add('bg-amber-50','ring-2','ring-inset','ring-amber-400');
   tr.setAttribute('aria-current','true');
  }
  tbody.appendChild(tr);
 });
 if(incidentTarget){
  const target=Array.from(tbody.rows).find(row=>row.dataset.incidentId===String(incidentTarget));
  if(target){
   target.scrollIntoView({behavior:'smooth',block:'center'});
   showMessage('Incidencia seleccionada desde Inicio. Está resaltada en el historial.');
  }else showMessage('Se abrió el historial del proveedor, pero la incidencia indicada ya no está disponible.',true);
 }
 }catch(e){box.innerHTML='<div class="p-6 text-sm text-rose-600">No se pudo consultar el historial. Verifica la conexión con el backend.</div>'}}
 function openModal(){if(!selected)return;$('form-error').textContent='';$('incident-form').reset();$('incident-status').value='ABIERTO';updateSeverity();$('incident-modal').classList.remove('hidden');$('incident-modal').classList.add('flex')};function closeModal(){$('incident-modal').classList.add('hidden');$('incident-modal').classList.remove('flex')}
 $('incident-type').addEventListener('change',updateSeverity);
 $('provider-search').addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(searchProviders,150)});$('change-provider').addEventListener('click',()=>{selected=null;$('selected-provider').classList.add('hidden');$('incident-workspace').classList.add('hidden');$('provider-search').focus()});$('open-incident').addEventListener('click',openModal);$('close-modal').addEventListener('click',closeModal);$('cancel-modal').addEventListener('click',closeModal);
 $('incident-form').addEventListener('submit',async e=>{e.preventDefault();if(!selected)return;const id=selected.idProveedor??selected.id;const payload={tipo:$('incident-type').value,severidad:$('incident-severity').value,estado:$('incident-status').value,descripcion:$('incident-description').value.trim()};if(!payload.tipo||!payload.descripcion){$('form-error').textContent='Completa el tipo y la descripción.';return}try{await TurisProAPI.crearIncidente(id,payload);$('incident-form').reset();updateSeverity();closeModal();showMessage('Incidente registrado correctamente y guardado en la base de datos.');await loadIncidents()}catch(err){$('form-error').textContent=err.message==='ERR_SERVER_OFFLINE'?'No hay conexión con el backend. Inícialo e inténtalo de nuevo.':(err.message||'No se pudo guardar el incidente.')}});
 document.addEventListener('click',e=>{if(!e.target.closest('#provider-search')&&!e.target.closest('#provider-results'))$('provider-results').classList.add('hidden')});loadProviders();
})();
</script>
</body></html>
